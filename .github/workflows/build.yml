name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o HanifTranslator.zip -d extracted
          ls -la extracted/

      - name: Find Project Root
        run: |
          find extracted -name "build.gradle*" -maxdepth 3
          find extracted -name "settings.gradle*" -maxdepth 3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd extracted
          if [ -d "HanifTranslator" ]; then
            cd HanifTranslator
          fi
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HanifTranslator-debug-apk
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
            extracted/build/outputs/apk/debug/*.apk
